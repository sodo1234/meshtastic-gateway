button_card_templates:
  lora_base:
    styles:
      card:
        - background: '#0a0a0a'
        - border-radius: 12px
        - border: '1px solid #1f1f1f'
        - box-shadow: none
        - overflow: hidden
        - '-webkit-tap-highlight-color': transparent
  lora_hdr:
    show_icon: false
    show_state: false
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 12px 0 4px 0
      name:
        - font-size: 10px
        - font-weight: 700
        - color: '#525252'
        - letter-spacing: 3px
        - text-transform: uppercase
        - justify-self: start
  lora_stat:
    template: lora_base
    show_state: true
    styles:
      card:
        - padding: 16px
      state:
        - font-size: 24px
        - font-weight: 800
        - font-variant-numeric: tabular-nums
        - line-height: 1
      name:
        - font-size: 8px
        - font-weight: 700
        - color: '#525252'
        - letter-spacing: 2px
      icon:
        - width: 20px
  lora_btn:
    template: lora_base
    styles:
      card:
        - padding: 12px
      icon:
        - width: 18px
      name:
        - font-size: 9px
        - font-weight: 700
        - letter-spacing: 1.5px
  lora_bin_tile:
    template: lora_base
    show_name: false
    show_state: false
    show_icon: false
    layout: fill
    styles:
      card:
        - padding: 10px 12px
        - margin-bottom: 4px
        - border-radius: 10px
        - border: 1px solid
        - box-shadow: none
    custom_fields:
      row: |
        [[[
          const fn = entity.attributes.friendly_name || entity.entity_id;
          const dev = fn.replace('LoRa ','');
          const eid = entity.entity_id;

          const m = eid.match(/lora_(\w+?)_/);
          const gw = m ? m[1].toUpperCase() : '?';

          let type = 'bin';
          if (eid.endsWith('_contact')) type = 'contact';
          if (eid.endsWith('_occupancy')) type = 'motion';

          const isOn = entity.state === 'on';

          let ico = 'mdi:checkbox-blank-circle-outline';
          if (type === 'contact') ico = isOn ? 'mdi:door-open' : 'mdi:door-closed';
          if (type === 'motion')  ico = isOn ? 'mdi:motion-sensor' : 'mdi:motion-sensor-off';

          let col = '#525252';
          let label = entity.state;

          if (type === 'contact') {
            col = isOn ? '#fbbf24' : '#4ade80';
            label = isOn ? 'OPEN' : 'CLOSED';
          }

          if (type === 'motion') {
            col = isOn ? '#fbbf24' : '#525252';
            label = isOn ? 'MOTION' : 'CLEAR';
          }

          const lsId  = eid.replace('binary_sensor.','sensor.').replace(/_(contact|occupancy)$/,'_last_seen');
          const batId = eid.replace('binary_sensor.','sensor.').replace(/_(contact|occupancy)$/,'_batt');

          const ls  = states[lsId];
          const bat = states[batId];

          const lsT  = ls && ls.state !== 'unavailable' ? ls.state : '--';
          const batT = bat && bat.state !== 'unavailable' ? bat.state + '%' : '--';

          const batN = (batT !== '--') ? parseInt(bat.state) : 100;
          const batC = (batT !== '--' && batN < 25) ? '#f87171' : '#525252';

          return `
            <div style="display:flex;align-items:center;gap:10px;width:100%;">
              <ha-icon icon="${ico}" style="width:20px;height:20px;color:${col};"></ha-icon>

              <span style="background:#141414;border:1px solid #22d3ee;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;color:#22d3ee;">
                ${gw}
              </span>

              <div style="flex:1;overflow:hidden;">
                <div style="font-size:12px;font-weight:700;color:#e5e5e5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  ${dev}
                </div>
                <div style="font-size:9px;color:#525252;">
                  ${lsT} · 🔋<span style="color:${batC};">${batT}</span>
                </div>
              </div>

              <span style="font-size:10px;font-weight:800;color:${col};letter-spacing:1px;">
                ${label}
              </span>
            </div>
          `;
        ]]]
  lora_alarm_tile:
    template: lora_base
    show_name: false
    show_state: false
    show_icon: false
    layout: fill
    styles:
      card:
        - padding: 10px 12px
        - margin-bottom: 4px
        - border-radius: 10px
        - border: 1px solid
        - box-shadow: none
    custom_fields:
      row: |
        [[[
          const fn = entity.attributes.friendly_name || entity.entity_id;
          const dev = fn.replace('LoRa ','');
          const eid = entity.entity_id;

          const m = eid.match(/lora_(\w+?)_/);
          const gw = m ? m[1].toUpperCase() : '?';

          const isOn = entity.state === 'on';

          let type = 'alarm';
          if (eid.endsWith('_smoke')) type = 'smoke';
          if (eid.endsWith('_water_leak')) type = 'leak';

          let ico = 'mdi:alert';
          if (type === 'smoke') ico = 'mdi:smoke-detector';
          if (type === 'leak')  ico = 'mdi:water-alert';

          const col = isOn ? '#f87171' : '#4ade80';
          const label = isOn ? (type === 'smoke' ? 'SMOKE!' : 'LEAK!') : 'OK';

          const lsId  = eid.replace('binary_sensor.','sensor.').replace(/_(smoke|water_leak)$/,'_last_seen');
          const batId = eid.replace('binary_sensor.','sensor.').replace(/_(smoke|water_leak)$/,'_batt');

          const ls  = states[lsId];
          const bat = states[batId];

          const lsT  = ls && ls.state !== 'unavailable' ? ls.state : '--';
          const batT = bat && bat.state !== 'unavailable' ? bat.state + '%' : '--';

          const batN = (batT !== '--') ? parseInt(bat.state) : 100;
          const batC = (batT !== '--' && batN < 25) ? '#f87171' : '#525252';

          return `
            <div style="display:flex;align-items:center;gap:10px;width:100%;">
              <ha-icon icon="${ico}" style="width:20px;height:20px;color:${col};"></ha-icon>

              <span style="background:#141414;border:1px solid #22d3ee;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;color:#22d3ee;">
                ${gw}
              </span>

              <div style="flex:1;overflow:hidden;">
                <div style="font-size:12px;font-weight:700;color:#e5e5e5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  ${dev}
                </div>
                <div style="font-size:9px;color:#525252;">
                  ${lsT} · 🔋<span style="color:${batC};">${batT}</span>
                </div>
              </div>

              <span style="font-size:10px;font-weight:800;color:${col};letter-spacing:1px;">
                ${label}
              </span>
            </div>
          `;
        ]]]
  lora_anom_tile:
    template: lora_base
    show_icon: false
    show_name: false
    show_state: false
    layout: fill
    styles:
      card:
        - background: '#0a0a0a'
        - border-radius: 10px
        - padding: 10px 12px
        - margin: 4px 0
        - border: '1px solid #1f1f1f'
        - box-shadow: none
    tap_action:
      action: call-service
      confirmation:
        text: Usunąć anomalię?
      service: mqtt.publish
      service_data:
        topic: >-
          [[[ return 'lora/anomaly/' +
          entity.entity_id.replace('sensor.lora_an_', '') + '/clear' ]]]
        payload: press
    custom_fields:
      row: |
        [[[
          const a = entity.attributes || {};
          const gw  = a.gw || '?';
          const dev = a.dev || entity.entity_id;
          const dt  = a.detected_at || '--';
          const t   = a.type || '';

          const val = entity.state || '';
          const numVal = parseFloat(val);
          const isNum = !isNaN(numVal);

          let tail = '';
          if ((t === 'low_battery' || t === 'critical_battery') && isNum) {
            const c = t === 'critical_battery' ? '#f87171' : '#fbbf24';
            tail = `<span style="font-size:10px;font-weight:800;color:${c};">${numVal}%</span>`;
          } else if ((t === 'temp_high' || t === 'temp_low') && isNum) {
            tail = `<span style="font-size:10px;font-weight:800;color:#fb923c;">${numVal}°C</span>`;
          } else if ((t === 'hum_high' || t === 'hum_low') && isNum) {
            tail = `<span style="font-size:10px;font-weight:800;color:#38bdf8;">${numVal}%</span>`;
          } else if (t === 'stagnation' && isNum && numVal > 0) {
            tail = `<span style="font-size:10px;font-weight:800;color:#c084fc;">${Math.round(numVal)}h</span>`;
          }

          // Type label mapping
          const typeLabels = {
            'device_offline': 'OFFLINE',
            'low_battery': 'LOW BATT',
            'critical_battery': 'CRIT BATT',
            'temp_high': 'TEMP ↑',
            'temp_low': 'TEMP ↓',
            'hum_high': 'HUM ↑',
            'hum_low': 'HUM ↓',
            'stagnation': 'STAGNATION',
            'smoke': 'SMOKE',
            'water_leak': 'LEAK'
          };
          const typeLabel = typeLabels[t] || t.toUpperCase();

          // Type color mapping
          const typeColors = {
            'device_offline': '#f87171',
            'low_battery': '#fbbf24',
            'critical_battery': '#f87171',
            'temp_high': '#fb923c',
            'temp_low': '#38bdf8',
            'hum_high': '#38bdf8',
            'hum_low': '#fb923c',
            'stagnation': '#c084fc',
            'smoke': '#f87171',
            'water_leak': '#f87171'
          };
          const typeColor = typeColors[t] || '#c084fc';

          return `
            <div style="display:flex;align-items:center;gap:8px;width:100%;">
              <span style="background:#141414;border:1px solid #22d3ee;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;color:#22d3ee;">
                ${gw}
              </span>

              <span style="font-size:12px;color:#e5e5e5;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                ${dev}
              </span>

              <span style="font-size:8px;font-weight:700;color:${typeColor};letter-spacing:1px;">
                ${typeLabel}
              </span>

              ${tail}

              <span style="font-size:9px;color:#525252;white-space:nowrap;">
                ${dt}
              </span>

              <span style="font-size:14px;color:#f87171;cursor:pointer;">✕</span>
            </div>
          `;
        ]]]
views:
  - path: lora-control
    title: Sterowanie
    icon: mdi:lightbulb
    cards:
      - type: custom:button-card
        template: lora_hdr
        name: STEROWANIE
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            template: lora_base
            entity: switch.lora_g1_test_1
            name: Test 1
            show_state: false
            tap_action:
              action: toggle
            icon: |
              [[[
                var av = states['binary_sensor.lora_g1_test_1_available'];
                if (av && av.state === 'off') return 'mdi:alert-octagon';
                return entity.state === 'on' ? 'mdi:lightbulb-on' : 'mdi:lightbulb-off-outline';
              ]]]
            custom_fields:
              badge: |
                [[[
                  return `<span style="background:#141414;border:1px solid #22d3ee;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;color:#22d3ee;">G1</span>`;
                ]]]
              info: |
                [[[
                  var av = states['binary_sensor.lora_g1_test_1_available'];
                  var ls = states['sensor.lora_g1_test_1_last_seen'];
                  var on = av && av.state === 'on';
                  var col = on ? '#4ade80' : '#f87171';
                  var label = on ? 'online' : 'offline';
                  var t = ls && ls.state !== 'unavailable' ? ls.state : '--';
                  return `<div style="font-size:10px;color:#525252;margin-top:6px;">
                    <span style="color:${col};">● ${label}</span><br/>${t}
                  </div>`;
                ]]]
            styles:
              card:
                - height: 120px
                - padding: 16px
                - border: |
                    [[[
                      var av = states['binary_sensor.lora_g1_test_1_available'];
                      if (av && av.state === 'off') return '1px solid #f87171';
                      return entity.state === 'on' ? '1px solid #facc15' : '1px solid #1f1f1f';
                    ]]]
              icon:
                - width: 35px
                - height: 35px
                - color: |
                    [[[
                      var av = states['binary_sensor.lora_g1_test_1_available'];
