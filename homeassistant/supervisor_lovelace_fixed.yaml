                    <div>${t}</div>
                  </div>`;
                ]]]
            styles:
              card:
                - height: 120px
                - padding: 16px
                - border: |
                    [[[
                      var av = states['binary_sensor.lora_door_1_door_1_available'];
                      if (av && av.state === 'off') return '1px solid #f87171';
                      return '1px solid #1f1f1f';
                    ]]]
              icon:
                - width: 35px
                - height: 35px
                - color: |
                    [[[
                      var av = states['binary_sensor.lora_door_1_door_1_available'];
                      if (av && av.state === 'off') return '#f87171';
                      return '#525252';
                    ]]]
              name:
                - font-size: 11px
                - font-weight: 700
                - color: '#e5e5e5'
              custom_fields:
                badge:
                  - position: absolute
                  - top: 10px
                  - right: 15px
                info:
                  - justify-self: start
                  - padding: 0
  - path: lora-sensors
    title: Pomiary
    icon: mdi:thermometer
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: lora_hdr
            name: POMIARY
          - type: custom:button-card
            template: lora_base
            entity: sensor.lora_temp_1_temp_1_temperature
            show_icon: false
            show_state: false
            show_name: false
            tap_action:
              action: none
            custom_fields:
              content: |
                [[[
                  var t = states['sensor.lora_temp_1_temp_1_temperature'];
