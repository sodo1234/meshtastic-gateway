                - border: |
                    [[[
                      var av = states['binary_sensor.lora_test_2_test_2_available'];
                      if (av && av.state === 'off') return '1px solid #f87171';
                      return entity.state === 'on' ? '1px solid #facc15' : '1px solid #1f1f1f';
                    ]]]
              icon:
                - width: 35px
                - height: 35px
                - color: |
                    [[[
                      var av = states['binary_sensor.lora_test_2_test_2_available'];
                      if (av && av.state === 'off') return '#f87171';
                      return entity.state === 'on' ? '#facc15' : '#525252';
                    ]]]
              name:
                - font-size: 11px
                - font-weight: 700
                - color: '#e5e5e5'
              custom_fields:
                badge:
                  - position: absolute
                  - top: 10px
                  - right: 15px
                info:
                  - justify-self: start
                  - padding: 0
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            template: lora_base
            entity: binary_sensor.lora_leak_1_leak_1_water_leak
            name: Leak 1
            show_state: false
            tap_action:
              action: none
            icon: |
