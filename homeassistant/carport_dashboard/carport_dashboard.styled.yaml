# Carport dashboard — STYL PROJEKTU (custom:button-card, dark #0a0a0a).
# Przekazniki _R USUNIETE. Kazdy kafel: timestamp + bateria(czujniki) + availability.
# Import: raw config editor -> wklej calosc.
title: Carport
button_card_templates:
  lora_base:
    styles:
      card:
      - background: '#0a0a0a'
      - border-radius: 12px
      - border: '1px solid #1f1f1f'
      - box-shadow: none
      - overflow: hidden
  lora_hdr:
    show_icon: false
    show_state: false
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 12px 0 4px 0
      name:
      - font-size: 10px
      - font-weight: 700
      - color: '#525252'
      - letter-spacing: 3px
      - text-transform: uppercase
      - justify-self: start
  lora_stat:
    template: lora_base
    show_state: true
    styles:
      card:
      - padding: 14px 16px
      - height: 88px
      grid:
      - grid-template-areas: '"n i" "s i"'
      - grid-template-columns: 1fr 22px
      - grid-template-rows: auto auto
      - align-items: center
      - column-gap: 10px
      state:
      - font-size: 19px
      - font-weight: 800
      - font-variant-numeric: tabular-nums
      - justify-self: start
      - color: '#e5e5e5'
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - line-height: '1.2'
      name:
      - font-size: 8px
      - font-weight: 700
      - color: '#525252'
      - letter-spacing: 2px
      - justify-self: start
      - margin-bottom: 6px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      icon:
      - width: 18px
      - color: '#525252'
      img_cell:
      - justify-self: center
      - align-self: center
  lora_btn:
    template: lora_base
    show_state: false
    styles:
      card:
      - padding: 14px 12px
      - height: 58px
      name:
      - font-size: 11px
      - font-weight: 800
      - letter-spacing: 1.5px
      - text-transform: uppercase
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      icon:
      - width: 20px
views:
- title: Bramka
  path: carport-gw
  icon: mdi:radio-tower
  type: sections
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      template: lora_hdr
      name: STATUS BRAMKI G1
      layout_options:
        grid_columns: 4
    - type: custom:button-card
      template: lora_stat
      entity: binary_sensor.lora_gw_g1_synced
      name: Synced
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_operating_mode
      name: Tryb pracy
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_sync_mode
      name: Tryb sync
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_uptime
      name: Uptime
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_tx_count
      name: TX count
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_batcher_pending
      name: Batcher kolejka
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_batcher_flushed
      name: Batcher wyslane
  - type: grid
    cards:
    - type: custom:button-card
      template: lora_hdr
      name: CZAS / SYNCHRONIZACJA
      layout_options:
        grid_columns: 4
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_scada_time
      name: Czas SCADA
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_system_time
      name: Czas systemowy
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_time_offset
      name: Offset
  - type: grid
    cards:
    - type: custom:button-card
      template: lora_hdr
      name: PARAMETRY P1-P3
      layout_options:
        grid_columns: 4
    - type: custom:button-card
      template: lora_stat
      entity: number.lora_gw_g1_param_p1
      name: P1
    - type: custom:button-card
      template: lora_stat
      entity: number.lora_gw_g1_param_p2
      name: P2
    - type: custom:button-card
      template: lora_stat
      entity: number.lora_gw_g1_param_p3
      name: P3
- title: Harmonogram
  path: carport-schedule
  icon: mdi:calendar-clock
  type: sections
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      template: lora_hdr
      name: HARMONOGRAM PRODUKCJI
      layout_options:
        grid_columns: 4
    - type: calendar
      entities:
      - calendar.lora_g1
      initial_view: dayGridMonth
      layout_options:
        grid_columns: 4
  - type: grid
    cards:
    - type: custom:button-card
      template: lora_hdr
      name: TRYB BIEZACY
      layout_options:
        grid_columns: 4
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_operating_mode
      name: Tryb pracy
    - type: custom:button-card
      template: lora_stat
      entity: sensor.lora_gw_g1_sync_mode
      name: Tryb sync
- title: Przekazniki
  path: carport-relays
  icon: mdi:toggle-switch-variant
  type: sections
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      template: lora_hdr
      name: INNE (2)
      layout_options:
        grid_columns: 4
    - type: custom:button-card
      template: lora_base
      entity: switch.test_1
      name: Test 1
      show_state: false
      show_label: false
      tap_action:
        action: toggle
      icon: '[[[ var e=states[''switch.test_1'']; return e&&e.state===''on''?''mdi:lightbulb-on'':''mdi:lightbulb-off-outline''; ]]]'
      custom_fields:
        info: '[[[ var e=states[''switch.test_1''];var parts=[];var off=(!e||e.state===''unavailable''||e.state===''unknown'');var lc=e?new Date(e.last_changed):null;var t=lc?((''0''+lc.getHours()).slice(-2)+'':''+(''0''+lc.getMinutes()).slice(-2)):''--'';parts.push(''🕐 ''+t);var dot=off?''<span style="color:#f87171;">● OFFLINE</span>'':''<span style="color:#4ade80;">● online</span>'';parts.push(dot);return ''<span style="font-size:9px;color:#737373;white-space:nowrap;">''+parts.join(''  ·  '')+''</span>''; ]]]'
      styles:
        card:
        - height: 76px
        - padding: 9px 12px
        - border: '[[[ var e=states[''switch.test_1'']; if(!e||e.state===''unavailable''||e.state===''unknown'')return ''1px solid #f87171''; return e.state===''on''?''1px solid #facc15'':''1px solid #1f1f1f''; ]]]'
        grid:
        - grid-template-areas: '"i n" "i info"'
        - grid-template-columns: 24px 1fr
        - grid-template-rows: auto auto
        - align-items: center
        - column-gap: 10px
        - row-gap: 3px
        icon:
        - width: 22px
        - height: 22px
        - color: '[[[ var e=states[''switch.test_1'']; if(!e||e.state===''unavailable''||e.state===''unknown'')return ''#f87171''; return e.state===''on''?''#facc15'':''#525252''; ]]]'
        name:
        - font-size: 11px
        - font-weight: 700
        - color: '#e5e5e5'
        - justify-self: start
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
