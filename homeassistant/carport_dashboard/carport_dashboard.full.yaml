# Carport dashboard — PELNY (4 widoki). entity_id ZWERYFIKOWANE na zywym HA carport (2026-06-29).
# Import: dashboard -> Edytuj -> ⋮ -> Raw configuration editor -> wklej calosc.
# Wzor: G1 lora-gw (Bramka/Harmonogram) + nowe (Przekazniki 105 / Czujniki ruchu 82).
title: Carport
views:
  - title: Bramka
    path: carport-gw
    icon: mdi:radio-tower
    cards:
      - type: entities
        title: "Status bramki G1"
        state_color: true
        entities:
          - entity: binary_sensor.lora_gw_g1_synced
            name: "Czas zsynchronizowany"
          - entity: sensor.lora_gw_g1_operating_mode
            name: "Tryb pracy"
          - entity: sensor.lora_gw_g1_sync_mode
            name: "Tryb synchronizacji"
          - entity: sensor.lora_gw_g1_uptime
            name: "Uptime"
          - entity: sensor.lora_gw_g1_tx_count
            name: "TX count"
          - entity: sensor.lora_gw_g1_batcher_pending
            name: "Batcher w kolejce"
          - entity: sensor.lora_gw_g1_batcher_flushed
            name: "Batcher wyslane"
      - type: entities
        title: "Czas i synchronizacja"
        entities:
          - entity: sensor.lora_gw_g1_scada_time
            name: "Czas SCADA"
          - entity: sensor.lora_gw_g1_system_time
            name: "Czas systemowy"
          - entity: sensor.lora_gw_g1_time_offset
            name: "Offset czasu"
          - entity: button.lora_gw_g1_request_sync
            name: "Wymus synchronizacje"
      - type: entities
        title: "Parametry P1-P3"
        entities:
          - entity: number.lora_gw_g1_param_p1
            name: "P1"
          - entity: number.lora_gw_g1_param_p2
            name: "P2"
          - entity: number.lora_gw_g1_param_p3
            name: "P3"
      - type: entities
        title: "Virtual I/O (test)"
        state_color: true
        entities:
          - entity: switch.lora_vio_vs_test
            name: "Test Switch"
          - entity: button.lora_vio_vb_test_press
            name: "Test Button"
  - title: Harmonogram
    path: carport-schedule
    icon: mdi:calendar-clock
    cards:
      - type: calendar
        title: "Harmonogram produkcji (G1)"
        initial_view: dayGridMonth
        entities:
          - calendar.lora_g1
      - type: entities
        title: "Tryb biezacy"
        state_color: true
        entities:
          - entity: sensor.lora_gw_g1_operating_mode
            name: "Tryb pracy"
          - entity: sensor.lora_gw_g1_sync_mode
            name: "Tryb synchronizacji"
          - entity: button.lora_gw_g1_request_sync
            name: "Wymus synchronizacje"
