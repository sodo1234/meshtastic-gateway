id: '1782251617912'
alias: Motion RB8 RB9 RB10 RB11
description: ''
triggers:
- entity_id:
  - binary_sensor.rb8_s1_occupancy
  - binary_sensor.rb8_s2_occupancy
  - binary_sensor.rb8_s3_occupancy
  - binary_sensor.rb8_s4_occupancy
  - binary_sensor.rb8_s5_occupancy
  - binary_sensor.rb8_s6_occupancy
  - binary_sensor.rb8_s7_occupancy
  - binary_sensor.rb8_s8_occupancy
  - binary_sensor.rb11_s1_occupancy
  - binary_sensor.rb11_s2_occupancy
  - binary_sensor.rb11_s3_occupancy
  - binary_sensor.rb11_s4_occupancy
  - binary_sensor.rb11_s5_occupancy
  - binary_sensor.rb11_s6_occupancy
  - binary_sensor.rb11_s7_occupancy
  - binary_sensor.rb11_s8_occupancy
  to: 'on'
  trigger: state
- entity_id:
  - binary_sensor.rb8_s1_occupancy
  - binary_sensor.rb8_s2_occupancy
  - binary_sensor.rb8_s3_occupancy
  - binary_sensor.rb8_s4_occupancy
  - binary_sensor.rb8_s5_occupancy
  - binary_sensor.rb8_s6_occupancy
  - binary_sensor.rb8_s7_occupancy
  - binary_sensor.rb8_s8_occupancy
  - binary_sensor.rb11_s1_occupancy
  - binary_sensor.rb11_s2_occupancy
  - binary_sensor.rb11_s3_occupancy
  - binary_sensor.rb11_s4_occupancy
  - binary_sensor.rb11_s5_occupancy
  - binary_sensor.rb11_s6_occupancy
  - binary_sensor.rb11_s7_occupancy
  - binary_sensor.rb11_s8_occupancy
  to: 'off'
  for:
    seconds: '{{ states(''input_number.motion_timeout'') | int(150) }}'
  trigger: state
conditions:
- condition: state
  entity_id: sun.sun
  state: below_horizon
- condition: state
  entity_id: input_boolean.motion_enabled
  state: 'on'
actions:
- choose:
  - conditions:
    - condition: template
      value_template: "{% set ss = ['binary_sensor.rb8_s1_occupancy', 'binary_sensor.rb8_s2_occupancy', 'binary_sensor.rb8_s3_occupancy', 'binary_sensor.rb8_s4_occupancy', 'binary_sensor.rb8_s5_occupancy', 'binary_sensor.rb8_s6_occupancy', 'binary_sensor.rb8_s7_occupancy', 'binary_sensor.rb8_s8_occupancy', 'binary_sensor.rb11_s1_occupancy', 'binary_sensor.rb11_s2_occupancy', 'binary_sensor.rb11_s3_occupancy', 'binary_sensor.rb11_s4_occupancy', 'binary_sensor.rb11_s5_occupancy', 'binary_sensor.rb11_s6_occupancy', 'binary_sensor.rb11_s7_occupancy', 'binary_sensor.rb11_s8_occupancy'] %}\n{% set ns = namespace(any_on=false) %}\n{% for s in ss %}\n  {% set lqi = 'sensor.' ~ s.split('.')[1] | replace('_occupancy','') ~ '_lqi' %}\n  {% if states(s) == 'on' and states(lqi) | int(0) > 0 %}{% set ns.any_on = true %}{% endif %}\n{% endfor %}\n{{ ns.any_on }}"
    sequence:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.rb8_2
        - switch.rb8_3
        - switch.rb9_2
        - switch.rb9_3
        - switch.rb10_2
        - switch.rb10_3
        - switch.rb11_2
        - switch.rb11_3
  - conditions:
    - condition: template
      value_template: "{% set ss = ['binary_sensor.rb8_s1_occupancy', 'binary_sensor.rb8_s2_occupancy', 'binary_sensor.rb8_s3_occupancy', 'binary_sensor.rb8_s4_occupancy', 'binary_sensor.rb8_s5_occupancy', 'binary_sensor.rb8_s6_occupancy', 'binary_sensor.rb8_s7_occupancy', 'binary_sensor.rb8_s8_occupancy', 'binary_sensor.rb11_s1_occupancy', 'binary_sensor.rb11_s2_occupancy', 'binary_sensor.rb11_s3_occupancy', 'binary_sensor.rb11_s4_occupancy', 'binary_sensor.rb11_s5_occupancy', 'binary_sensor.rb11_s6_occupancy', 'binary_sensor.rb11_s7_occupancy', 'binary_sensor.rb11_s8_occupancy'] %}\n{% set ns = namespace(any_on=false) %}\n{% for s in ss %}\n  {% set lqi = 'sensor.' ~ s.split('.')[1] | replace('_occupancy','') ~ '_lqi' %}\n  {% if states(s) == 'on' and states(lqi) | int(0) > 0 %}{% set ns.any_on = true %}{% endif %}\n{% endfor %}\n{{ not ns.any_on }}"
    sequence:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.rb8_2
        - switch.rb8_3
        - switch.rb9_2
        - switch.rb9_3
        - switch.rb10_2
        - switch.rb10_3
        - switch.rb11_2
        - switch.rb11_3
mode: restart
