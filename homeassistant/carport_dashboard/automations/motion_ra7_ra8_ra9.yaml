- entity_id:
  - binary_sensor.ra7_s1_occupancy
  - binary_sensor.ra7_s2_occupancy
  - binary_sensor.ra7_s3_occupancy
  - binary_sensor.ra7_s4_occupancy
  - binary_sensor.ra7_s5_occupancy
  - binary_sensor.ra7_s6_occupancy
  - binary_sensor.ra7_s7_occupancy
  - binary_sensor.ra7_s8_occupancy
  - binary_sensor.ra7_s9_occupancy
  - binary_sensor.ra7_s10_occupancy
  - binary_sensor.ra9_s1_occupancy
  - binary_sensor.ra9_s2_occupancy
  - binary_sensor.ra9_s3_occupancy
  - binary_sensor.ra9_s4_occupancy
  - binary_sensor.ra9_s5_occupancy
  - binary_sensor.ra9_s6_occupancy
  - binary_sensor.ra9_s7_occupancy
  - binary_sensor.ra9_s8_occupancy
  - binary_sensor.ra9_s9_occupancy
  - binary_sensor.ra9_s10_occupancy
  to: 'on'
  trigger: state
- entity_id:
  - binary_sensor.ra7_s1_occupancy
  - binary_sensor.ra7_s2_occupancy
  - binary_sensor.ra7_s3_occupancy
  - binary_sensor.ra7_s4_occupancy
  - binary_sensor.ra7_s5_occupancy
  - binary_sensor.ra7_s6_occupancy
  - binary_sensor.ra7_s7_occupancy
  - binary_sensor.ra7_s8_occupancy
  - binary_sensor.ra7_s9_occupancy
  - binary_sensor.ra7_s10_occupancy
  - binary_sensor.ra9_s1_occupancy
  - binary_sensor.ra9_s2_occupancy
  - binary_sensor.ra9_s3_occupancy
  - binary_sensor.ra9_s4_occupancy
  - binary_sensor.ra9_s5_occupancy
  - binary_sensor.ra9_s6_occupancy
  - binary_sensor.ra9_s7_occupancy
  - binary_sensor.ra9_s8_occupancy
  - binary_sensor.ra9_s9_occupancy
  - binary_sensor.ra9_s10_occupancy
  to: 'off'
  for:
    seconds: '{{ states(''input_number.motion_timeout'') | int(150) }}'
  trigger: state
conditions:
- condition: state
  entity_id: sun.sun
  state: below_horizon
- condition: state
  entity_id: input_boolean.motion_enabled
  state: 'on'
actions:
- choose:
  - conditions:
    - condition: template
      value_template: "{% set ss = ['binary_sensor.ra7_s1_occupancy', 'binary_sensor.ra7_s2_occupancy', 'binary_sensor.ra7_s3_occupancy', 'binary_sensor.ra7_s4_occupancy', 'binary_sensor.ra7_s5_occupancy', 'binary_sensor.ra7_s6_occupancy', 'binary_sensor.ra7_s7_occupancy', 'binary_sensor.ra7_s8_occupancy', 'binary_sensor.ra7_s9_occupancy', 'binary_sensor.ra7_s10_occupancy', 'binary_sensor.ra9_s1_occupancy', 'binary_sensor.ra9_s2_occupancy', 'binary_sensor.ra9_s3_occupancy', 'binary_sensor.ra9_s4_occupancy', 'binary_sensor.ra9_s5_occupancy', 'binary_sensor.ra9_s6_occupancy', 'binary_sensor.ra9_s7_occupancy', 'binary_sensor.ra9_s8_occupancy', 'binary_sensor.ra9_s9_occupancy', 'binary_sensor.ra9_s10_occupancy'] %}\n{% set ns = namespace(any_on=false) %}\n{% for s in ss %}\n  {% set lqi = 'sensor.' ~ s.split('.')[1] | replace('_occupancy','') ~ '_lqi' %}\n  {% if states(s) == 'on' and states(lqi) | int(0) > 0 %}{% set ns.any_on = true %}{% endif %}\n{% endfor %}\n{{ ns.any_on }}"
    sequence:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.ra7_2
        - switch.ra7_3
        - switch.ra8_2
        - switch.ra8_3
        - switch.ra9_2
        - switch.ra9_3
  - conditions:
    - condition: template
      value_template: "{% set ss = ['binary_sensor.ra7_s1_occupancy', 'binary_sensor.ra7_s2_occupancy', 'binary_sensor.ra7_s3_occupancy', 'binary_sensor.ra7_s4_occupancy', 'binary_sensor.ra7_s5_occupancy', 'binary_sensor.ra7_s6_occupancy', 'binary_sensor.ra7_s7_occupancy', 'binary_sensor.ra7_s8_occupancy', 'binary_sensor.ra7_s9_occupancy', 'binary_sensor.ra7_s10_occupancy', 'binary_sensor.ra9_s1_occupancy', 'binary_sensor.ra9_s2_occupancy', 'binary_sensor.ra9_s3_occupancy', 'binary_sensor.ra9_s4_occupancy', 'binary_sensor.ra9_s5_occupancy', 'binary_sensor.ra9_s6_occupancy', 'binary_sensor.ra9_s7_occupancy', 'binary_sensor.ra9_s8_occupancy', 'binary_sensor.ra9_s9_occupancy', 'binary_sensor.ra9_s10_occupancy'] %}\n{% set ns = namespace(any_on=false) %}\n{% for s in ss %}\n  {% set lqi = 'sensor.' ~ s.split('.')[1] | replace('_occupancy','') ~ '_lqi' %}\n  {% if states(s) == 'on' and states(lqi) | int(0) > 0 %}{% set ns.any_on = true %}{% endif %}\n{% endfor %}\n{{ not ns.any_on }}"
    sequence:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.ra7_2
        - switch.ra7_3
        - switch.ra8_2
        - switch.ra8_3
        - switch.ra9_2
        - switch.ra9_3
mode: restart
