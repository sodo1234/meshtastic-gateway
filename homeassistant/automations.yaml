# =============================================================
# automations.yaml — LoRa SCADA (cleaned for v37)
# =============================================================
# Only automations that communicate with supervisor.py
# Calendar override toggles: when ON, gateway gets its own calendar
# =============================================================

- id: lora_override_g1_on
  alias: "LoRa Override G1 ON"
  trigger:
    - platform: state
      entity_id: input_boolean.lora_override_g1
      to: "on"
  action:
    - service: mqtt.publish
      data:
        topic: "ha/lora/schedule/override"
        payload: '{"gw":"G1","on":true}'

- id: lora_override_g1_off
  alias: "LoRa Override G1 OFF"
  trigger:
    - platform: state
      entity_id: input_boolean.lora_override_g1
      to: "off"
  action:
    - service: mqtt.publish
      data:
        topic: "ha/lora/schedule/override"
        payload: '{"gw":"G1","on":false}'

