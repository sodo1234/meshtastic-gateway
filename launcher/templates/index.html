<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Meshtastic Launcher</title>
<style>
  /* Paleta dashboard.yaml (lora_base / lora_hdr / lora_stat) */
  :root{
    --bg:#0a0a0a; --card:#141414; --border:#1f1f1f; --border-strong:#2a2a2a;
    --fg:#e5e5e5; --mut:#525252; --mut2:#888;
    --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --accent:#22d3ee;
    --ui-font:'Inter','Segoe UI',system-ui,sans-serif;
    --mono:'JetBrains Mono','Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;font-family:var(--ui-font);}
  body{margin:0;background:var(--bg);color:var(--fg);font-size:14px;}
  /* HEADER — dashboard style: subtle, all-caps wordmark */
  header{padding:18px 22px;background:#0a0a0a;border-bottom:1px solid var(--border);
         display:flex;justify-content:space-between;align-items:center;gap:14px;}
  h1{margin:0;font-size:13px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--fg);}
  h1 .accent{color:var(--accent);margin-right:8px;}
  /* GRID */
  .gridwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;height:calc(100vh - 70px);}
  .gridwrap.one-col{grid-template-columns:1fr;}        /* 1-kol: jedna kolumna, drugi panel UKRYTY (nie stackowany) */
  .gridwrap.one-col #panel-sup{display:none;}          /* ukryj SUPERVISOR → GATEWAY na całą szerokość */
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;
         display:flex;flex-direction:column;overflow:hidden;}
  /* PANEL HEADER — uppercase mini-label per lora_hdr */
  .panel h2{margin:0;padding:14px 16px 6px 16px;background:transparent;border:none;
            font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
            color:var(--mut);display:flex;justify-content:space-between;align-items:center;}
  .ctl{padding:8px 14px 14px 14px;display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;
       border-bottom:1px solid var(--border);}
  label{color:var(--mut);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
  select,input{background:#0a0a0a;color:var(--fg);border:1px solid var(--border);padding:9px 12px;
               border-radius:8px;font-size:13px;font-family:var(--ui-font);font-weight:500;}
  select:focus,input:focus{outline:none;border-color:var(--accent);}
  .btnrow{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  button{background:#0a0a0a;color:var(--fg);border:1px solid var(--border-strong);
         padding:12px 20px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:800;
         letter-spacing:1.5px;text-transform:uppercase;transition:transform .08s;}
  button:hover{filter:brightness(1.25);}
  button:active{transform:scale(.97);}
  button:hover{background:#374151;}
  /* BUTTONS — dashboard chip style with subtle accent borders */
  button.start{color:var(--ok);border-color:var(--ok);}
  button.start:hover{background:rgba(74,222,128,.08);}
  button.stop{color:var(--bad);border-color:var(--bad);}
  button.stop:hover{background:rgba(248,113,113,.08);}
  button.clear{color:var(--accent);border-color:var(--accent);}
  button.clear:hover{background:rgba(34,211,238,.08);}
  /* STATUS chip — uppercase + tabular nums */
  .status{padding:10px 16px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--border);
          font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
          font-variant-numeric:tabular-nums;}
  .status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
               background:#333;margin-right:10px;vertical-align:middle;
               transition:background .25s, box-shadow .25s;}
  .status.running .dot{background:var(--ok);box-shadow:0 0 10px var(--ok),0 0 2px var(--ok);}
  .status.running{color:var(--ok);}
  .status.stopped .dot{background:var(--bad);}
  .status.stopped{color:var(--mut2);}
  /* CONSOLE — raw terminal, BLACK bg, monospace, dense lines */
  pre.log{flex:1;overflow:auto;padding:10px 14px;margin:0;
          font-family:var(--mono);font-size:13px;line-height:1.55;
          background:#000;white-space:pre-wrap;word-break:break-word;
          border-top:1px solid var(--border);
          font-variant-numeric:tabular-nums;
          -webkit-font-smoothing:antialiased;}
  pre.log::-webkit-scrollbar{width:8px;}
  pre.log::-webkit-scrollbar-track{background:#000;}
  pre.log::-webkit-scrollbar-thumb{background:#222;border-radius:4px;}
  pre.log .ts{color:#3a3a3a;font-size:11px;margin-right:8px;font-weight:500;}
  pre.log .badge{display:inline-block;padding:1px 7px;margin-right:6px;border-radius:4px;
                 font-size:10px;font-weight:800;letter-spacing:1px;background:#141414;
                 color:#cbd5e1;border:1px solid #374151;text-transform:uppercase;}
  /* Component badges — dashboard chip style (dark bg + accent border + accent text) */
  pre.log .b-main {background:#141414;color:#60a5fa;border-color:#1e3a8a;}
  pre.log .b-mqtt {background:#141414;color:#c084fc;border-color:#581c87;}
  pre.log .b-lora {background:#141414;color:#fb923c;border-color:#7c2d12;}
  pre.log .b-ha   {background:#141414;color:#4ade80;border-color:#14532d;}
  pre.log .b-disc {background:#141414;color:#facc15;border-color:#854d0e;}
  pre.log .b-batch{background:#141414;color:#22d3ee;border-color:#0e7490;}
  pre.log .b-an,pre.log .b-anom{background:#141414;color:#fb7185;border-color:#9f1239;}
  pre.log .b-sync {background:#141414;color:#a5b4fc;border-color:#4338ca;}
  pre.log .b-hb   {background:#141414;color:#4ade80;border-color:#166534;}
  pre.log .b-cmd  {background:#141414;color:#fcd34d;border-color:#a16207;}
  pre.log .b-status,pre.log .b-state{background:#141414;color:#9ca3af;border-color:#374151;}
  pre.log .b-avail,pre.log .b-ping  {background:#141414;color:#5eead4;border-color:#0f766e;}
  pre.log .b-check{background:#141414;color:#c4b5fd;border-color:#7c3aed;}
  pre.log .b-err,pre.log .b-error   {background:#141414;color:#f87171;border-color:#7f1d1d;}
  pre.log .b-debug{background:#141414;color:#94a3b8;border-color:#475569;}
  pre.log .emoji{margin-right:4px;}
  pre.log .line-err{color:#fca5a5;background:rgba(127,29,29,.18);padding:1px 4px;border-radius:2px;}
  pre.log .line-warn{color:#fbbf24;}
  pre.log .line-trace{color:#f87171;font-style:italic;opacity:.85;}
  pre.log .line-info{color:#e8e8e8;}
  pre.log .line-debug{color:#7dd3fc;opacity:.85;}
  pre.log .line-mut{color:#888;}
  /* Level tag — dot-pill style */
  pre.log .lvl{display:inline-block;padding:1px 6px;margin-right:6px;border-radius:4px;
               font-size:9px;font-weight:800;letter-spacing:1.5px;background:#141414;
               border:1px solid;text-transform:uppercase;min-width:48px;text-align:center;}
  pre.log .lvl-info {color:#60a5fa;border-color:#1e3a8a;}
  pre.log .lvl-debug{color:#7dd3fc;border-color:#0c4a6e;}
  pre.log .lvl-warn {color:#fbbf24;border-color:#854d0e;}
  pre.log .lvl-error{color:#f87171;border-color:#7f1d1d;}
  .toast{position:fixed;bottom:14px;right:14px;background:#141414;border:1px solid var(--accent);
         color:var(--accent);padding:10px 16px;border-radius:8px;font-size:11px;
         font-weight:800;letter-spacing:1.5px;text-transform:uppercase;display:none;z-index:99;}
  /* CONFIG EDITOR modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
         align-items:center;justify-content:center;z-index:200;}
  .modal .box{background:var(--card);border:1px solid var(--border-strong);border-radius:12px;
              width:min(900px,92vw);height:min(80vh,800px);display:flex;flex-direction:column;overflow:hidden;}
  .modal .mhead{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;
                justify-content:space-between;align-items:center;gap:12px;}
  .modal .mhead .ttl{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--mut);}
  .modal .mhead .path{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .modal textarea{flex:1;background:#000;color:var(--fg);border:none;border-top:1px solid var(--border);
                  border-bottom:1px solid var(--border);padding:12px 14px;resize:none;
                  font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre;
                  tab-size:4;outline:none;}
  .modal .mfoot{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .modal .mfoot .cfgstatus{font-family:var(--mono);font-size:11px;color:var(--mut2);flex:1;
                           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<header>
  <h1><span class="accent">●</span>Meshtastic · Launcher</h1>
  <div style="display:flex;gap:14px;align-items:center;">
    <button class="clear" id="layout-btn" onclick="toggleLayout()">Układ: 2 kol</button>
    <button class="clear" onclick="clearAll()">Clear consoles</button>
    <span style="color:var(--mut);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;">localhost:8765</span>
  </div>
</header>

<div class="gridwrap">
  <div class="panel" id="panel-sup"></div>
  <div class="panel" id="panel-gw"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="cfg-modal">
  <div class="box">
    <div class="mhead">
      <span class="ttl">config.py · <span id="cfg-host" style="color:var(--fg)"></span></span>
      <span class="path" id="cfg-path"></span>
    </div>
    <textarea id="cfg-text" spellcheck="false"></textarea>
    <div class="mfoot">
      <span class="cfgstatus" id="cfg-status"></span>
      <button class="clear" onclick="reloadConfig()">↻ Reload</button>
      <button class="start" onclick="saveConfig()">💾 Save</button>
      <button class="stop" onclick="closeConfig()">✕ Close</button>
    </div>
  </div>
</div>

<script>
const ROLES = [{key:"sup", title:"SUPERVISOR"}, {key:"gw", title:"GATEWAY"}];
const state = {sup:{host:null,script:null,es:null}, gw:{host:null,script:null,es:null}};
let hosts = {tailscale:[], lan:[]};

function toast(msg, ms=2500){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms);
}

// Układ: 1 kolumna (panele jeden pod drugim) lub 2 (obok siebie). Wybór zapamiętany.
function applyLayout(){
  const one = localStorage.getItem('layout') === '1';
  const gw = document.querySelector('.gridwrap');
  if(gw) gw.classList.toggle('one-col', one);
  const b = document.getElementById('layout-btn');
  if(b) b.textContent = one ? 'Układ: 1 kol' : 'Układ: 2 kol';
}
function toggleLayout(){
  const one = localStorage.getItem('layout') === '1';
  localStorage.setItem('layout', one ? '2' : '1');
  applyLayout();
}

function panelHTML(role){
  const r = role.key;
  return `
    <h2>${role.title}
      <span class="status" id="st-${r}"><span class="dot"></span><span id="sttxt-${r}">checking…</span></span>
    </h2>
    <div class="ctl">
      <label>Network</label>
      <select id="net-${r}" onchange="renderHosts('${r}')">
        <option value="tailscale">Tailscale</option><option value="lan">LAN</option>
      </select>
      <label>Host</label>
      <select id="host-${r}" onchange="onHostChange('${r}')"></select>
      <label>Script</label>
      <select id="script-${r}" onchange="onScriptChange('${r}')"></select>
      <label>USB port</label>
      <select id="port-${r}" title="Wykryte urzadzenia szeregowe (by-id)"></select>
      <label></label>
      <div id="usbinfo-${r}" style="font-size:10px;color:var(--mut);grid-column:2;">USB: —</div>
      <div class="btnrow">
        <button class="start" onclick="doStart('${r}')">▶ Start</button>
        <button class="stop" onclick="doStop('${r}')">■ Stop</button>
        <button class="clear" onclick="openConfig('${r}')">⚙ Config</button>
      </div>
    </div>
    <div class="mon" id="mon-${r}" style="font-size:11px;padding:5px 4px;border-top:1px solid var(--line,#222);margin-top:4px;line-height:1.35;">🩺 monitor…</div>
    <pre class="log" id="log-${r}">[idle]</pre>
  `;
}

function onScriptChange(r){
  closeStream(r);
  ensureStream(r);
}

function renderHosts(r){
  const net = document.getElementById(`net-${r}`).value;
  const sel = document.getElementById(`host-${r}`);
  const list = (hosts[net]||[]);
  sel.innerHTML = list.map(h => `<option value="${h.ip}">${h.name} (${h.ip})</option>`).join('')
                  || '<option value="">(none)</option>';
  // Domyślny host wg roli: sup→supervisor, gw→gateway (bez tego oba panele brały 1. opcję=gateway).
  const want = r==='sup' ? 'supervisor' : r==='gw' ? 'gateway' : '';
  if(want){ const m = list.find(h => (h.name||'').toLowerCase().includes(want)); if(m) sel.value = m.ip; }
  onHostChange(r);
}

async function onHostChange(r){
  const host = document.getElementById(`host-${r}`).value;
  closeStream(r);  // zamknij poprzedni stream zanim przelaczymy host
  state[r].host = host;
  if(!host){ document.getElementById(`script-${r}`).innerHTML=''; return; }
  // 1) scripts
  const j = await fetch(`/api/scripts?host=${host}`).then(x=>x.json());
  const sel = document.getElementById(`script-${r}`);
  // Domyślny skrypt: NAJPIERW test_step5_anomaly.py (aktualny harness → log /tmp/test_transport.log,
  // świeży). Bez tego launcher brał 'gateway.py' → /tmp/gateway.log = STARY log v38 (mylące „dane z 22").
  const prefs = r==='test' ? ['test_step1_transport.py']
              : ['test_step5_anomaly.py', r==='sup' ? 'supervisor.py' : 'gateway.py'];
  const defaultName = prefs.find(n => (j.scripts||[]).includes(n)) || (j.scripts||[])[0] || '';
  sel.innerHTML = (j.scripts||[]).map(s =>
    `<option ${s===defaultName?'selected':''} value="${s}">${s}</option>`).join('');
  // 2) USB devices
  await refreshUsb(r);
  refreshStatus(r);
}

async function refreshUsb(r, attempt=0){
  const host = state[r].host; if(!host) return;
  const j = await fetch(`/api/usb-devices?host=${host}`).then(x=>x.json()).catch(()=>({devices:[]}));
  const sel = document.getElementById(`port-${r}`);
  const info = document.getElementById(`usbinfo-${r}`);
  if(!j.devices || j.devices.length === 0){
    // pusto (relay w dołku / cache jeszcze zimny) → ponów do 3× co 4s przed werdyktem „brak".
    // Bez tego pojedynczy pad na starcie blokował USB aż do ręcznego przełączenia hosta.
    if(state[r].host === host && attempt < 3){
      info.innerHTML = '<span style="color:var(--mut)">USB: wykrywanie…</span>';
      setTimeout(()=>refreshUsb(r, attempt+1), 4000);
      return;
    }
    sel.innerHTML = '<option value="">(brak USB)</option>';
    info.innerHTML = '<span style="color:var(--bad)">⚠ brak wykrytych urządzeń serial</span>';
    return;
  }
  // pre-select: gw → ttyACM0/ttyUSB0, sup → ttyACM1/ttyUSB1 (heurystyka)
  const preferIdx = r === 'gw' ? 0 : Math.min(1, j.devices.length - 1);
  sel.innerHTML = j.devices.map((d,i) =>
    `<option value="${d.byid}" ${i===preferIdx?'selected':''}>${d.tty}</option>`).join('');
  info.innerHTML = j.devices.map(d =>
    `<div>• ${d.tty} <span style="color:var(--accent)">${d.label}</span></div>`).join('');
}

function getScript(r){ return document.getElementById(`script-${r}`)?.value || ''; }

async function refreshStatus(r){
  const host = state[r].host; if(!host) return;
  if(state[r].busy) return;                 // operacja start/stop w toku → nie nadpisuj etykiety
  const script = getScript(r);
  const j = await fetch(`/api/status?host=${host}&role=${r}&script=${encodeURIComponent(script)}`).then(x=>x.json());
  if(state[r].busy) return;                 // operacja wystartowała w trakcie awaita → nie nadpisuj
  const el = document.getElementById(`st-${r}`);
  const tx = document.getElementById(`sttxt-${r}`);
  const prev = el.classList.contains('running');
  el.classList.remove('running','stopped');
  el.classList.add(j.running ? 'running' : 'stopped');
  tx.textContent = j.running
    ? `RUNNING [${j.mode||'?'}] pid=${j.pid||'?'} • ${j.log}`
    : `STOPPED • ${j.log}`;
  if(prev && !j.running) toast(`⚠ ${r.toUpperCase()} stopped (crash?) — check log`);
  ensureStream(r);
}

function ensureStream(r){
  if(state[r].es) return;
  const host = state[r].host;
  const script = getScript(r);
  const es = new EventSource(`/api/stream?host=${host}&role=${r}&script=${encodeURIComponent(script)}`);
  const log = document.getElementById(`log-${r}`);
  log.textContent='';
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    const line = colorize(d.line);
    log.innerHTML += line + '\n';
    if(log.childNodes.length > 4000) log.innerHTML = log.innerHTML.split('\n').slice(-3000).join('\n');
    log.scrollTop = log.scrollHeight;
  };
  state[r].es = es;
}
function closeStream(r){
  if(state[r].es){ state[r].es.close(); state[r].es=null; }
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);}

function colorize(line){
  // 1) strip ANSI escape sequences
  let clean = line.replace(/\x1b\[[0-9;]*m/g, '');
  // 2) detect & isolate timestamp HH:MM:SS at start
  let html = '';
  const tsM = clean.match(/^(\d{2}:\d{2}:\d{2})\s+(.*)$/);
  if(tsM){ html += `<span class="ts">${tsM[1]}</span>`; clean = tsM[2]; }
  // 3) detect status emoji prefix
  const emojiM = clean.match(/^([✅⚠❌🚀📡🏠🔭📻⚡⏰🔧🔄💾🛰️🌙☀️])\s+(.*)$/u);
  if(emojiM){ html += `<span class="emoji">${emojiM[1]}</span>`; clean = emojiM[2]; }
  // 4) detect [LEVEL] tag (INFO/DEBUG/WARN/ERROR) — typowy format Python logger
  const lvlM = clean.match(/^\[(INFO|DEBUG|WARN|WARNING|ERROR)\]\s+(.*)$/);
  let levelTag = '';
  if(lvlM){
    const lvl = lvlM[1].toLowerCase().replace('warning','warn');
    html += `<span class="lvl lvl-${lvl}">${lvlM[1]}</span>`;
    levelTag = lvl;
    clean = lvlM[2];
  }
  // 5) detect [COMPONENT] badge
  const badgeM = clean.match(/^\[([A-Za-z0-9_-]+)\]\s+(.*)$/);
  if(badgeM){
    const tag = badgeM[1].toLowerCase();
    html += `<span class="badge b-${tag}">${esc(badgeM[1])}</span>`;
    clean = badgeM[2];
  }
  // 6) classify rest text
  const cleanEsc = esc(clean);
  const lvl = levelTag === 'error' || /ERROR|EXCEPTION|FileNotFound|❌/i.test(clean) ? 'err'
            : /^Traceback|^\s*File "|^\s*~|^\s*\^|line \d+, in /i.test(clean) ? 'trace'
            : levelTag === 'warn' || /WARN|⚠/i.test(clean) ? 'warn'
            : levelTag === 'debug' ? 'debug'
            : (badgeM || levelTag === 'info') ? 'info' : 'mut';
  html += `<span class="line-${lvl}">${cleanEsc}</span>`;
  return html;
}

// ── Busy state: przycisk reaguje NATYCHMIAST, robota leci w tle (poll /api/op) ──
function _btns(r){ return document.querySelectorAll(`#panel-${r} .btnrow button`); }
function setBusy(r, label){
  state[r].busy = true;
  _btns(r).forEach(b => { b.disabled = true; b.style.opacity = .5; });
  const el = document.getElementById(`st-${r}`), tx = document.getElementById(`sttxt-${r}`);
  if(el){ el.classList.remove('running','stopped'); }
  if(tx){ tx.textContent = label; }
}
function clearBusy(r){
  state[r].busy = false;
  if(state[r]._iv){ clearInterval(state[r]._iv); state[r]._iv = null; }
  _btns(r).forEach(b => { b.disabled = false; b.style.opacity = 1; });
}
function pollOp(r, action){
  if(state[r]._iv){ clearInterval(state[r]._iv); }   // nie nakładaj pollOpów
  const host = state[r].host;
  let tries = 0;
  state[r]._iv = setInterval(async ()=>{
    tries++;
    const j = await fetch(`/api/op?host=${host}&role=${r}`).then(x=>x.json()).catch(()=>null);
    if(j && j.action === action && j.busy === false){
      clearBusy(r);                                  // czyści też interwał
      toast(j.ok ? `${action} ✓ ${j.result||''}` : `${action} ⚠ ${j.result||'błąd'}`);
      refreshStatus(r);
    } else if(tries > 80){                            // bezpiecznik ~120s
      clearBusy(r); refreshStatus(r);
    }
  }, 1500);
}

async function doStart(r){
  const host = state[r].host;
  const script = getScript(r);
  const port = document.getElementById(`port-${r}`).value;
  if(!host || !script) return toast('wybierz host + skrypt');
  closeStream(r);
  setBusy(r, `⏳ STARTUJĘ ${script}…`);
  toast(`start ${script} → ${host} (w tle)`);
  await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({host, role:r, script, port})}).then(x=>x.json()).catch(()=>({}));
  pollOp(r, 'start');
}
async function doStop(r){
  const host = state[r].host;
  const script = getScript(r);
  closeStream(r);
  setBusy(r, '⏳ ZATRZYMUJĘ…');
  await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({host, role:r, script})}).then(x=>x.json()).catch(()=>({}));
  pollOp(r, 'stop');
}
async function doRestart(r){
  await doStop(r); setTimeout(()=>doStart(r), 1500);
}
async function doRefresh(r){
  // wyczysc konsole, zamknij stary stream, wymus nowy snapshot
  document.getElementById(`log-${r}`).innerHTML = '[refreshing…]';
  closeStream(r);
  await refreshUsb(r);
  refreshStatus(r);
}
async function openTail(r){
  const host = state[r].host;
  await fetch('/api/open-tail',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({host, role:r})});
  toast('wt.exe tail opened');
}
function clearLog(r){
  document.getElementById(`log-${r}`).innerHTML = '';
}
function clearAll(){
  ROLES.forEach(role => clearLog(role.key));
  toast('konsole wyczyszczone (skrypty biegną dalej)');
}
async function pullLog(r){
  const host = state[r].host;
  const j = await fetch('/api/pull-log',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({host, role:r})}).then(x=>x.json());
  toast(j.ok ? `pulled (${j.size}B) → ${j.path}` : `pull failed: ${j.err}`);
}
async function bothStart(){ doStart('sup'); setTimeout(()=>doStart('gw'), 500); }
async function bothStop(){ doStop('sup'); doStop('gw'); }

// ── Config editor (remote config.py: view + AST-validated save + .bak) ──
let cfgHost = null;
async function loadConfigInto(host){
  const ta = document.getElementById('cfg-text');
  const st = document.getElementById('cfg-status');
  ta.value = 'ładowanie…'; st.textContent = '';
  const j = await fetch(`/api/config?host=${host}`).then(x=>x.json()).catch(()=>({ok:false,err:'fetch failed'}));
  if(j.ok){
    ta.value = j.content;
    document.getElementById('cfg-path').textContent = j.path;
    st.textContent = `${j.content.length} B załadowane`;
  } else {
    ta.value = '';
    st.textContent = '✗ błąd odczytu: ' + (j.err||'?');
  }
}
async function openConfig(r){
  const host = state[r].host;
  if(!host) return toast('najpierw wybierz host');
  cfgHost = host;
  const roleLabel = r === 'gw' ? 'CONFIG BRAMKI' : r === 'sup' ? 'CONFIG SUPERVISORA' : 'CONFIG';
  document.getElementById('cfg-host').textContent = `${roleLabel} · ${host}`;
  document.getElementById('cfg-modal').style.display = 'flex';
  await loadConfigInto(host);
}
function reloadConfig(){ if(cfgHost) loadConfigInto(cfgHost); }
function closeConfig(){ document.getElementById('cfg-modal').style.display = 'none'; cfgHost = null; }
async function saveConfig(){
  if(!cfgHost) return;
  const content = document.getElementById('cfg-text').value;
  const st = document.getElementById('cfg-status');
  st.textContent = 'zapisywanie…';
  const j = await fetch('/api/config-save',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({host:cfgHost, content})}).then(x=>x.json()).catch(()=>({ok:false,err:'fetch failed'}));
  if(j.ok){
    st.textContent = '✓ ' + j.msg + '  ·  .bak zapisany';
    toast('config zapisany ✓ — zrestartuj skrypt by zadziałał');
  } else {
    st.textContent = '✗ ODRZUCONO: ' + (j.msg||j.err);
    toast('zapis odrzucony (walidacja AST?)');
  }
}
// Esc zamyka modal
document.addEventListener('keydown', e => { if(e.key==='Escape') closeConfig(); });

(async function init(){
  applyLayout();
  ROLES.forEach(role => document.getElementById(`panel-${role.key}`).innerHTML = panelHTML(role));
  const j = await fetch('/api/hosts').then(x=>x.json()); hosts = j;
  ROLES.forEach(role => renderHosts(role.key));
  setInterval(()=> ROLES.forEach(role => refreshStatus(role.key)), 5000);
  setTimeout(()=> ROLES.forEach(role => refreshMonitor(role.key)), 2500);
  setInterval(()=> ROLES.forEach(role => refreshMonitor(role.key)), 15000);
})();

async function refreshMonitor(r){
  const host = state[r].host; if(!host) return;
  const script = getScript(r);
  const el = document.getElementById(`mon-${r}`); if(!el) return;
  try{
    const j = await fetch(`/api/monitor?host=${host}&role=${r}&script=${encodeURIComponent(script)}`).then(x=>x.json());
    if(j.error || j.health==='—'){ el.innerHTML = '🩺 <span style="color:var(--mut)">monitor: '+(j.note||'—')+'</span>'; return; }
    const col = j.health==='OK' ? '#4ade80' : (j.health==='UWAGA' ? '#fbbf24' : '#f87171');
    const active = Object.values(j.rules).filter(x=>x.n>0);
    const det = active.length ? active.map(x=>`${x.label}: ${x.n}`).join(' · ') : 'brak zdarzeń w oknie';
    el.innerHTML = `🩺 <b style="color:${col}">${j.health}</b> `
      + `<span style="color:var(--mut)">· straty ${j.loss} · nieprawidł. ${j.irreg} · TX/RX ${j.tx}/${j.rx} · ${j.lines} lin</span>`
      + `<div style="font-size:10px;color:var(--mut);margin-top:2px;">${det}</div>`;
    el.title = active.length ? active.map(x=>`${x.label} (${x.n}): ${x.last}`).join('\n') : 'brak zdarzeń w oknie logu';
  }catch(e){ el.innerHTML = '🩺 <span style="color:var(--mut)">monitor: błąd zapytania</span>'; }
}
